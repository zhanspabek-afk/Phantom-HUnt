<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Охотник на Нечисть — Гримуар Охотника</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grimoire">
    <span class="corner-tl"></span>
    <span class="corner-tr"></span>
    <span class="corner-bl"></span>
    <span class="corner-br"></span>

    <div class="title-block">
        <h1>Охотник на Нечисть</h1>
        <div class="subtitle">Гримуар искоренения тьмы</div>
    </div>

    <div class="stats-bar">
        <span><span class="label">Победы</span><span id="wins-count" class="wins">0</span></span>
        <span><span class="label">Прайм-этап</span><span id="stage-count" class="stage">0</span>/10</span>
        <span><span class="label">Поражения</span><span id="losses-count" class="losses">0</span></span>
    </div>

    <div class="battle-arena">
        <!-- Охотник -->
        <div class="combatant-card">
            <div class="combatant-name player-title">Охотник</div>
            <div class="combatant-sub">хранитель гримуара</div>
            <div id="player-medallion-wrap" class="medallion-wrap">
                <div class="medallion-rune-ring"></div>
                <div class="medallion-ring">
                    <div id="player-medallion" class="medallion"></div>
                </div>
            </div>
            <div class="hp-bar-bg">
                <div id="player-hp-bar" class="hp-bar-fill"></div>
            </div>
            <div class="hp-text"><span id="player-hp-text">100</span> / <span id="player-max-hp-text">100</span> HP</div>
        </div>

        <div class="vs-divider">VS</div>

        <!-- Враг -->
        <div class="combatant-card">
            <h3 id="enemy-name" class="combatant-name ghost-title">Поиск...</h3>
            <p id="enemy-type" class="combatant-sub">-</p>
            <div id="enemy-medallion-wrap" class="medallion-wrap">
                <div class="medallion-rune-ring"></div>
                <div class="medallion-ring">
                    <div id="enemy-medallion" class="medallion"></div>
                </div>
            </div>
            <span id="enemy-rarity" class="rarity-badge rarity-common">Обычный</span>
            <div class="hp-bar-bg">
                <div id="enemy-hp-bar" class="hp-bar-fill enemy-hp"></div>
            </div>
            <div class="hp-text"><span id="enemy-hp-text">0</span> / <span id="enemy-max-hp">0</span> HP</div>
        </div>
    </div>

    <!-- Инвентарь Артефактов -->
    <div class="artifacts-section">
        <div class="artifacts-title">
            <span>Экипированные Артефакты</span>
            <span id="art-count">0/3</span>
        </div>
        <div class="artifacts-grid">
            <div id="art-0" class="artifact-card"><div class="artifact-empty">Слот 1<br>Пусто</div></div>
            <div id="art-1" class="artifact-card"><div class="artifact-empty">Слот 2<br>Пусто</div></div>
            <div id="art-2" class="artifact-card"><div class="artifact-empty">Слот 3<br>Пусто</div></div>
        </div>
    </div>

    <!-- Реликвии (оружие) -->
    <div id="weapons-box" class="weapons-grid">
        <button class="relic-btn" data-weapon="rapier"><span class="relic-icon">🗡️</span> Рапира</button>
        <button class="relic-btn" data-weapon="salt"><span class="relic-icon">🧂</span> Соль</button>
        <button class="relic-btn" data-weapon="chains"><span class="relic-icon">⛓️</span> Цепи</button>
        <button class="relic-btn" data-weapon="cross"><span class="relic-icon">✝️</span> Крест</button>
    </div>

    <button id="next-btn" class="btn-next">Следующий бой</button>

    <!-- Боевой журнал -->
    <div id="log" class="log-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
